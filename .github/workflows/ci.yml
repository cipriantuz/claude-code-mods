name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Claude Code (provides the mod test kit) and pytest
        run: |
          npm install -g @anthropic-ai/claude-code
          python -m pip install pytest
      - name: Run all tests
        run: npm test
