name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The mods target Windows, the author's environment, and their tests use Windows path fixtures.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Claude Code (provides the mod test kit) and pytest
        run: |
          npm install -g @anthropic-ai/claude-code
          python -m pip install pytest
      - name: Run all tests
        run: npm test

  dispatcher-posix:
    # The approval-channel dispatcher also has a POSIX locking path, which only runs on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Dispatcher tests
        run: python -m pytest -q -p no:cacheprovider mods/approval-channel/bin
